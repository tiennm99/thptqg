# thptqg2017 data-old/ — 63 .xlsx files (pre-baotintuc refresh).
#
# sheet_mode = "first": single-sheet workbooks, never hit the 65k row cap.
# SBD validation: require ^\d+$ (build-database-old.js:55 guard).
# strip_blank_rows = false: no explicit blank-skip in build-database-old.js.
#
# Table shape, INSERT and subject regexes are canonical — see src/schema.rs.

reader:
  sheet_mode: first
  strip_blank_rows: false

columns:
  ho_ten: 0
  ngay_sinh: 1
  so_bao_danh: 2
  diem_thi: 3

validation:
  require_numeric_sbd: true
  require_nonempty_name: true
  require_nonempty_sbd: true

header:
  tokens: ["HO_TEN", "HỌ TÊN", "STT"]
